# Lumen envelope and its boundary. The envelope is the measurable limit of the
# concerned cohort, established by a frozen encoder rather than assimilated per site.
envelope:
  encoder:
    name: ct_fm_frozen
    architecture: voxel_resnet3d
    in_channels: 1
    stem_channels: 16
    stage_channels: [16, 32, 64, 96]
    stage_blocks: [1, 1, 2, 2]
    bottleneck_channels: 128
    norm: group
    norm_groups: 8
    activation: gelu
    frozen: true
    output_heads: [envelope_logits, centreline_heatmap]
  surface:
    method: marching_cubes
    level: 0.5
    spacing_mm: 0.8
  boundary:
    distance_clip_mm: 12.0
    signed_distance: true
  centreline:
    extraction: skeleton_heatmap_argmax
    resample_step_mm: 1.0
