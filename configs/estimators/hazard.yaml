# Rung-wise outcome model q^(k)(s, a) entering the direct part of Eq. (4), and the
# selective state-space hazard head over the excursion history h_1:t.
outcome:
  form: logistic_regression
  rung_features:
    - envelope_max_excursion_mm
    - dwell_integral_mm_s
    - calcification_grade
    - lesion_length_mm
    - stage_onehot
    - territory_onehot
    - site_onehot
  l2: 1.0e-3
  max_iter: 500
  clip_observations: true
hazard:
  architecture: selective_state_space
  d_model: 32
  d_state: 8
  expand: 2
  n_layers: 2
  d_conv: 4
  dt_rank: 4
  dropout: 0.0
  head: hazard_logit_per_rung
  sequence: excursion_history
  conditioning: anatomy_context
  fit:
    epochs: 40
    batch_size: 256
    lr: 3.0e-3
    weight_decay: 1.0e-4
    warmup_fraction: 0.05
    schedule: cosine
    grad_clip: 1.0
    precision: fp32
    seeds: [0, 1, 2, 3, 4]
    device: cpu
