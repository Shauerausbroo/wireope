[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wireope"
version = "1.0.0"
description = "Off-policy strategy certification for CTA-conditioned guidewire crossing"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "scikit-learn>=1.4",
  "torch>=2.4",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "black>=24.0",
  "isort>=5.13",
  "mypy>=1.11",
]

[project.scripts]
wireope-reconstruct = "wireope.cli.reconstruct:main"
wireope-fit = "wireope.cli.fit:main"
wireope-estimate = "wireope.cli.estimate:main"
wireope-certify = "wireope.cli.certify:main"
wireope-studies = "wireope.cli.studies:main"
wireope-verify = "wireope.cli.verify:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wireope = ["reference/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 108
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# Import order belongs to isort alone; the two tools disagree on aliased member
# imports and running both leaves those statements oscillating between runs.
select = ["E", "F", "UP", "B", "SIM", "RET", "C4", "PIE", "PT"]
ignore = ["E501", "B008", "B905"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PT011", "PT018"]

[tool.isort]
profile = "black"
line_length = 108
known_first_party = ["wireope"]
combine_as_imports = true
force_sort_within_sections = false

[tool.black]
line-length = 108
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/wireope"]
exclude = ["tests", "scripts"]
warn_unreachable = true
plugins = []

[[tool.mypy.overrides]]
module = ["scipy.*", "sklearn.*"]
ignore_missing_imports = true
follow_imports = "silent"
